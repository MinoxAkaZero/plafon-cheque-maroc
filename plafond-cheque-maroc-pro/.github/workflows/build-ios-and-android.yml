name: PlafondChèque Maroc Pro — CI Tests, Debug Builds & Signed Production Releases (v11.0.0)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Build Mode (debug-testing or production-release)'
        required: false
        default: 'debug-testing'
        type: choice
        options:
          - debug-testing
          - production-release

jobs:
  automated-tests:
    name: 1. Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Engine, Cryptographic, Persistence & Notification Test Suite
        run: |
          PKG_DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)")
          cd "$PKG_DIR"
          npm test

  android-debug-testing:
    name: 2. Android Debug / Testing Build (APK)
    needs: automated-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Non-Destructive Capacitor Sync & Debug APK Build
        run: |
          PKG_DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)")
          cd "$PKG_DIR"
          npm install @capacitor/core@6.1.0 @capacitor/cli@6.1.0 @capacitor/android@6.1.0 @capacitor/local-notifications@6.1.0
          # Preserve existing custom AndroidManifest.xml and resources; only run cap add if android/build.gradle is absent
          if [ ! -f "android/build.gradle" ]; then
            cp -f android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.backup.xml 2>/dev/null || true
            rm -rf android
            npx cap add android
            if [ -f "/tmp/AndroidManifest.backup.xml" ]; then
              cp -f /tmp/AndroidManifest.backup.xml android/app/src/main/AndroidManifest.xml
            fi
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PlafondCheque-Maroc-Pro-Android-Debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PlafondCheque-Maroc-Pro-Android-Debug-APK
          path: PlafondCheque-Maroc-Pro-Android-Debug.apk

  android-production-release:
    name: 3. Android Signed Production Release (APK & AAB)
    needs: automated-tests
    if: github.event.inputs.release_mode == 'production-release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Signed Production APK & Play Store AAB (if signing secrets configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          PKG_DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)")
          cd "$PKG_DIR"
          npm install @capacitor/core@6.1.0 @capacitor/cli@6.1.0 @capacitor/android@6.1.0 @capacitor/local-notifications@6.1.0
          if [ ! -f "android/build.gradle" ]; then
            cp -f android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.backup.xml 2>/dev/null || true
            rm -rf android
            npx cap add android
            if [ -f "/tmp/AndroidManifest.backup.xml" ]; then
              cp -f /tmp/AndroidManifest.backup.xml android/app/src/main/AndroidManifest.xml
            fi
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release-keystore.jks
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=/tmp/release-keystore.jks \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            rm -f /tmp/release-keystore.jks
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PlafondCheque-Maroc-Pro-Android-Signed-Release.apk" || true
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/PlafondCheque-Maroc-Pro-Android-PlayStore.aab" || true
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 secret not configured. Skipping signed production bundle; use android-debug-testing artifact or configure GitHub Repository Secrets."
          fi

  ios-build-and-archive:
    name: 4. iOS Testing & Signed App Store Archive
    needs: automated-tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Non-Destructive Capacitor Sync & iOS Build
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PKG_DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)")
          cd "$PKG_DIR"
          npm install @capacitor/core@6.1.0 @capacitor/cli@6.1.0 @capacitor/ios@6.1.0 @capacitor/local-notifications@6.1.0
          # Preserve existing custom Info.plist, PrivacyInfo.xcprivacy, and Assets.xcassets
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            cp -rf ios /tmp/ios_custom_backup 2>/dev/null || true
            rm -rf ios
            npx cap add ios
            if [ -d "/tmp/ios_custom_backup/App/App" ]; then
              cp -f /tmp/ios_custom_backup/App/App/Info.plist ios/App/App/Info.plist 2>/dev/null || true
              cp -f /tmp/ios_custom_backup/App/App/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy 2>/dev/null || true
              cp -rf /tmp/ios_custom_backup/App/App/Assets.xcassets/* ios/App/App/Assets.xcassets/ 2>/dev/null || true
            fi
          fi
          npx cap sync ios
          cd ios/App
          if [ -n "$IOS_CERTIFICATE_P12_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Building Signed iOS Release Archive with Apple Developer Credentials..."
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" archive
          else
            echo "Building Unsigned iOS Testing Bundle (Configure IOS_CERTIFICATE_P12_BASE64, IOS_PROVISIONING_PROFILE_BASE64 & APPLE_TEAM_ID secrets for App Store Connect IPA signing)..."
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
            mkdir -p "$GITHUB_WORKSPACE/Payload"
            cp -r build/Build/Products/Release-iphoneos/App.app "$GITHUB_WORKSPACE/Payload/"
            cd "$GITHUB_WORKSPACE"
            zip -r PlafondCheque-Maroc-Pro-iOS-Testing-Unsigned.ipa Payload
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlafondCheque-Maroc-Pro-iOS-Testing-Bundle
          path: PlafondCheque-Maroc-Pro-iOS-Testing-Unsigned.ipa
