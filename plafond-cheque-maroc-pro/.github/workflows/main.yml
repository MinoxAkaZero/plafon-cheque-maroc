name: CI — Automated Unit, Parity & Real Browser E2E Verification (v11.0.0)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  automated-unit-tests:
    name: 1. Node.js Unit, Integration & Parity Tests (55 Checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute Node.js Test Suite
        run: |
          PKG_DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)")
          cd "$PKG_DIR"
          npm test

  browser-e2e-tests:
    name: 2. Headless Chromium Real WebCrypto & IndexedDB E2E Tests (24 Checks)
    needs: automated-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true
      - name: Install Selenium & Run Unmocked Browser E2E Suite
        run: |
          PKG_DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)")
          cd "$PKG_DIR"
          pip install -r tests/requirements.txt
          python3 tests/e2e_browser_audit.py
